# Tests the app and publishes it to GitHub Pages on every push to main.
# Run manually: Actions tab → "Deploy to GitHub Pages" → Run workflow (or `gh workflow run pages.yml`).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs that run npm packages only read the repo; publishing rights are given to deploy alone.
permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

# Jobs run test → build → deploy; nothing is published if a test fails.
# Build and deploy are separate jobs: deploy-pages sometimes failed to see an
# artifact uploaded seconds earlier in the same job ("No artifacts named
# github-pages"). Starting a new job gives the artifact time to register.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      # Headless run of the real app in the runner's preinstalled Google Chrome.
      - run: npm run test:smoke

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the app goes to the site: the page and its modules, no screenshots, tests or tooling.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
