<!doctype html>
<html lang="ru" data-theme="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121C32">
<meta name="mobile-web-app-capable" content="yes">
<title>Снежные ноты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Nunito:wght@700;800;900&family=Rubik:wght@500;700;800&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" hidden>
  <div class="hudtop">
    <button class="b ico" id="btnHudHome" data-ta="home" data-icon="home"></button>
    <div id="prog" data-ta="progress"><i></i></div>
    <div class="pill" id="micPill" data-ta="mic"><span data-icon="mic"></span><span id="micbars"><i></i><i></i><i></i><i></i></span><span id="heard">—</span></div>
    <button class="b ico" id="btnRec"></button>
    <button class="b ico qhands" id="btnHands"></button>
    <button class="b ico qcam"></button>
    <button class="b ico qfull" data-ta="full" data-icon="fullscreen"></button>
  </div>
  <!-- Playback controls: a column on the left edge under Home, like a media player. While the game runs: Pause;
       while it is paused the same button turns into Resume and Restart and the input mode join it. -->
  <div class="hudctl" id="hudCtl">
    <button class="b ico" id="btnPause" data-ta="pause"></button>
    <button class="b ico" id="btnRestart" data-ta="restart" data-icon="retry" hidden></button>
    <button class="b ico qinput" hidden></button>
  </div>
  <!-- Playback speed: a vertical slider on the right edge, like the speed setting of a video player: a rabbit at
       the top (1.3×), a turtle at the bottom (0.5×), a mark at 1×, the speed written in the knob. It changes the
       speed of the running song in place; hidden in the listen-only preview. -->
  <div class="hudspd" id="hudSpd">
    <span class="spdend" data-icon="rabbit"></span>
    <div class="spdrail" id="spdRail" role="slider" tabindex="0" data-ta="speed" aria-orientation="vertical">
      <div class="spdtrack"><i class="spdfill"></i><i class="spdone"></i><b class="spdknob" id="spdVal">1×</b></div>
    </div>
    <span class="spdend" data-icon="turtle"></span>
  </div>
</div>

<!-- Self-view: the player sees themself from the front camera; drag to move, tap to resize -->
<div id="cam" hidden>
  <video id="camVideo" autoplay muted playsinline></video>
  <p id="camMsg" role="alert" hidden></p>
  <button class="x" id="btnCamClose" data-ta="close" data-icon="cross"></button>
</div>

<div class="screen" id="home" hidden>
  <div class="homeworld" aria-hidden="true"></div>
  <div class="corner l"><button class="b who" id="btnWho" data-ta="who"></button></div>
  <div class="corner r">
    <button class="b ico qlang" data-ta="language"></button>
    <button class="b ico qtheme" data-ta="theme"></button>
    <button class="b ico" id="btnBackupNag" data-ta="backupNag" data-icon="arrow-down" hidden style="opacity:.6"></button>
    <button class="b ico qinput"></button>
    <button class="b ico qfull" id="btnFull" data-ta="full" data-icon="fullscreen"></button>
    <button class="b ico" id="btnSettings" data-ta="settings" data-icon="gear"></button>
  </div>
  <!-- Camera and video cards: a column on the right edge under the corner buttons -->
  <div class="corner r media">
    <button class="b ico qcam"></button>
    <button class="b ico qrec"></button>
    <button class="b ico qvcard" hidden></button>
  </div>
  <div class="songs" id="songs"></div>
  <!-- The level path on a frosted panel: the theme world behind it is blurred, so the path reads as one layer -->
  <div class="pathbox">
    <div class="levels" id="levels"></div>
    <div class="levelxp" id="levelXp" aria-hidden="true" hidden></div>
  </div>
  <div class="hint" id="homeHint" role="status" aria-live="polite"></div>
  <div class="playrow">
    <button class="b listen" id="btnListen" data-ta="listen" data-icon="eye"></button>
    <button class="b primary play" id="btnPlay" data-ta="play" data-icon="play" data-fill="1"></button>
  </div>
  <div class="micstate" id="micErr" role="alert" hidden>
    <span class="micbadge" data-icon="mic"><span class="x" data-icon="cross"></span></span>
    <div class="micbody">
      <div class="micacts">
        <button class="b primary micretry" id="btnMicRetry" data-icon="retry"><span data-t="micRetry"></span></button>
        <button class="b mictouch" id="btnMicTouch" data-icon="play"><span data-t="micTouch"></span></button>
      </div>
      <p class="michint" id="micHint" data-t="micDenied"></p>
    </div>
  </div>
</div>

<!-- Player list: a popup over home, like the quick picker; close with the cross, a tap outside or Back.
     Each player's card has Edit (opens the child's page) and Delete (tap twice). -->
<div class="screen" id="profiles" hidden>
  <div class="panel popp" role="dialog" aria-labelledby="pTitle">
    <button class="b ico x" id="btnProfClose" data-ta="close" data-icon="cross"></button>
    <h2 class="poph" id="pTitle" data-t="who"></h2>
    <div class="grid" id="ptiles"></div>
  </div>
</div>

<!-- New player wizard: 1) how the game looks and speaks (language + theme), 2) avatar and name, 3) the first note to play (it can be skipped).
     A panel over the theme picture, like the popups; Back sits on the panel's top-left corner. -->
<div class="screen" id="newp" hidden>
  <div class="panel popp newpp">
    <button class="b ico back" id="btnNewBack" data-ta="back" data-icon="back"></button>
    <div class="steps"><i id="st1" class="on"></i><i id="st2"></i><i id="st3"></i></div>
    <div class="wiz" id="step1">
      <div class="langpick" id="langPick" role="group" data-ta="language"></div>
      <div class="themes small" id="themePick" role="group" data-ta="theme"></div>
      <button class="b primary go" id="btnLookNext" data-ta="next" data-icon="next"></button>
    </div>
    <div class="wiz" id="step2" hidden>
      <div class="avpick" id="avpick"></div>
      <input class="name-in" id="newName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off">
      <button class="b primary go" id="btnNewOk" data-ta="next" data-icon="next"></button>
    </div>
    <div class="wiz intro" id="step3" hidden>
      <div class="islide"><div id="firstNote"></div><p data-t="introFall"></p></div>
      <div class="btnrow">
        <button class="b skip" id="btnIntroSkip"><span data-t="introSkip"></span></button>
        <button class="b primary go" id="btnIntroNext" data-ta="next" data-icon="next"></button>
      </div>
    </div>
  </div>
</div>

<!-- Child's own page: change name, avatar and theme. Opened from the player list (or parent settings); close with the cross, a tap outside or Back -->
<div class="screen" id="me" hidden>
  <div class="panel popp mep" role="dialog" aria-labelledby="meTitle">
    <button class="b ico x" id="btnMeBack" data-ta="close" data-icon="cross"></button>
    <button class="b ico qlang" data-ta="language"></button>
    <h2 class="poph" id="meTitle" data-t="myPage"></h2>
    <div class="mehead"><span id="meAv"></span><input class="name-in" id="meName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off"></div>
    <div class="avpick" id="meAvPick"></div>
    <div class="themes small" id="meThemes"></div>
    <button class="b primary go" id="btnMeOk" data-ta="done" data-icon="check"></button>
  </div>
</div>

<div class="screen" id="results" hidden>
  <div class="panel">
    <button class="b ico qvcard vcorner" hidden></button>
    <div class="stars-big" id="resStars"></div>
    <div class="respct" id="resPct">0%</div>
    <div class="levelup" id="resLevelUp" hidden></div>
    <div class="xprow" id="resXp"></div>
    <!-- Fixed slots: secondary icons on the left (Home, Replay, Next), the one primary action always on the right. -->
    <div class="btnrow resbtns">
      <button class="b ico" id="btnHome" data-ta="home" data-icon="home"></button>
      <button class="b ico" id="btnAgain" data-ta="again" data-icon="retry" hidden></button>
      <button class="b ico" id="btnNext" data-ta="nextLevel" data-icon="next" hidden></button>
      <button class="b primary wide" id="btnMain" data-ta="again"></button>
    </div>
  </div>
</div>

<div class="screen" id="settings" hidden>
  <div class="sheet">
    <button class="b x" id="btnSetClose" data-ta="close" data-icon="cross"></button>
    <h2 data-t="sHead"></h2>
    <h3 data-t="sPlayer"></h3>
    <div class="spick" id="sPick" role="group" data-ta="sPlayerPick"></div>
    <!-- Songs x levels for the chosen player: progress in each cell, tap a cell to change how much of the song that level plays -->
    <div class="lenwrap"><table class="lentable" id="sLen"></table></div>
    <div class="row lenrow"><small data-t="sLenHelp"></small><button class="b txtbtn" id="btnLenReset" data-t="sLenReset"></button></div>
    <div class="row"><label data-t="myPage"></label><button class="b txtbtn" id="btnKidPage" data-t="sKidOpen"></button><small data-t="sKidHint"></small></div>
    <div class="row"><label data-t="sIntro"></label><button class="b txtbtn" id="btnIntro" data-t="sIntroBtn"></button><small data-t="sIntroHelp"></small></div>
    <div class="row"><label for="sLang" data-t="sLang"></label><select id="sLang"></select></div>
    <div class="row"><label for="sTempo" data-t="sTempo"></label><output id="oTempo"></output>
      <input type="range" id="sTempo" min="50" max="130" step="5"><small data-t="sTempoHelp"></small></div>
    <div class="row"><label for="sTol" data-t="sTol"></label><output id="oTol"></output>
      <input type="range" id="sTol" min="0" max="800" step="10"><small data-t="sTolHelp"></small></div>
    <div class="row"><label for="sLabels" data-t="sLabels"></label><select id="sLabels"></select></div>
    <div class="row"><label for="sHint" data-t="sHint"></label><input type="checkbox" id="sHint"></div>
    <div class="row"><label for="sOct" data-t="sOct"></label><input type="checkbox" id="sOct"><small data-t="sOctHelp"></small></div>
    <div class="row"><label for="sLock" data-t="sLock"></label><input type="checkbox" id="sLock"><small data-t="sLockHelp"></small></div>
    <div class="row"><label data-t="sProgress"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnReset"></button>
      <button class="b txtbtn danger" id="btnDelete"></button></div></div>
    <h3 data-t="sDevice"></h3>
    <div class="row"><label for="sLat" data-t="sLat"></label><output id="oLat"></output>
      <input type="range" id="sLat" min="0" max="300" step="10"><small data-t="sLatHelp"></small></div>
    <div class="row"><label for="sSens" data-t="sSens"></label><output id="oSens"></output>
      <input type="range" id="sSens" min="1" max="10" step="1"><small data-t="sSensHelp"></small></div>
    <div class="row"><label for="sTouch" data-t="sTouch"></label><input type="checkbox" id="sTouch"><small data-t="sTouchHelp"></small></div>
    <div class="row"><label data-t="sBackup"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnBackup" data-t="sBackupSave"></button>
      <button class="b txtbtn" id="btnRestore" data-t="sBackupLoad"></button></div>
      <input type="file" id="restoreFile" hidden>
      <small id="backupInfo"></small>
      <div id="restoreAsk" hidden style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end">
        <span id="restoreText" style="flex:1 1 220px;font-size:14px;line-height:1.35"></span>
        <button class="b txtbtn" id="btnRestoreNo" data-t="cancel"></button>
        <button class="b txtbtn danger" id="btnRestoreYes" data-t="replace"></button></div></div>
    <h3 class="dangerhead" data-t="sDanger"></h3>
    <div class="row dangerzone"><label data-t="sWipe"></label><button class="b txtbtn danger" id="btnWipe" data-t="sWipeBtn"></button>
      <small data-t="sWipeHelp"></small>
      <div id="wipeAsk" hidden style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end">
        <span id="wipeText" style="flex:1 1 220px;font-size:14px;line-height:1.35"></span>
        <button class="b txtbtn" id="btnWipeNo" data-t="cancel"></button>
        <button class="b txtbtn danger" id="btnWipeYes" data-t="sWipeYes"></button></div></div>
    <p style="opacity:.75;font-size:13px;margin:14px 0 0" data-t="sNote"></p>
  </div>
</div>

<!-- Video card: watch the last recording, save it as a file, send it or delete it -->
<div class="screen" id="vcard" hidden>
  <div class="panel vcp" role="dialog" aria-labelledby="vcTitle">
    <button class="b ico x" id="btnVcClose" data-ta="close" data-icon="cross"></button>
    <h2 class="poph" id="vcTitle" data-t="vcardTitle"></h2>
    <video id="vcVideo" controls playsinline preload="metadata"></video>
    <div class="btnrow">
      <button class="b ico" id="btnVcDelete" data-ta="vcardDelete" data-icon="trash"></button>
      <button class="b ico" id="btnVcShare" data-ta="vcardShare" data-icon="share" hidden></button>
      <button class="b primary wide" id="btnVcSave" data-icon="arrow-down"><span data-t="vcardSave"></span></button>
    </div>
    <p class="vcmsg" id="vcMsg" role="status"></p>
  </div>
</div>

<!-- Quick picker (home, new player, child's page): either languages with flags or themes with their splash screens -->
<div class="screen" id="pop" hidden>
  <div class="panel popp" role="dialog" aria-labelledby="popTitle">
    <button class="b ico x" id="btnPopClose" data-ta="close" data-icon="cross"></button>
    <h2 class="poph" id="popTitle"></h2>
    <div class="langs" id="popLangs"></div>
    <div class="themes small" id="popThemes"></div>
  </div>
</div>

<!-- Splash: theme mascots, shown once per launch for returning players -->
<div id="splash" hidden role="button" tabindex="0" data-ta="tapToStart">
  <div class="sp-fx" aria-hidden="true"></div>
  <div class="sp-cast"></div>
  <h1 class="sp-title" data-t="title"></h1>
  <div class="sp-sub"></div>
  <div class="sp-tap" data-t="tapToStart"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
