<!doctype html>
<html lang="ru" data-theme="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121C32">
<meta name="mobile-web-app-capable" content="yes">
<title>Снежные ноты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Nunito:wght@700;800;900&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen stage (canvas) with falling notes over a keyboard; DOM screens on top
   (home = one-tap start, players, new player in 2 steps, results, pause, parent settings).
   Design grid is 1280x800 (Huawei MatePad 11 logical, 16:10); --u = 1 design px scaled to the screen.
   Themes come from jingle-keys-themes.zip: pixel, plastic, winter, anime. Each theme is deliberately dark. */
:root{
  --u: clamp(.55px, min(calc(100vw / 1280), calc(100vh / 800)), 1.6px);
  --cap: square; --join: miter; --bevel: 0 0 0 transparent;
  color-scheme: dark;
}
@media (orientation: portrait){ :root{ --u: clamp(.5px, min(calc(100vw / 820), calc(100vh / 1180)), 1.6px); } }
:root[data-theme="pixel"]{ --bg:#121C32; --panel:#263650; --border:#405775; --accent:#54D77C; --accent-dark:#1B854D; --reward:#FFD35C; --soft-error:#E9B878; --text:#F5F8FF; --on-accent:#0d2a1a;
  --font-ui:"Golos Text",system-ui,sans-serif; --radius:3px; --cap:square; --join:miter; --bevel: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.18); }
:root[data-theme="plastic"]{ --bg:#393477; --panel:#6256A6; --border:#9183D7; --accent:#5CE3AF; --accent-dark:#209B78; --reward:#FFDA6C; --soft-error:#FFD4A1; --text:#FFF9FF; --on-accent:#0f3a2c;
  --font-ui:"Nunito",system-ui,sans-serif; --radius:28px; --cap:round; --join:round; --bevel: inset 0 6px 0 rgba(255,255,255,.18); }
:root[data-theme="winter"]{ --bg:#153B4A; --panel:#285564; --border:#50808B; --accent:#FFD18A; --accent-dark:#A97738; --reward:#FFD18A; --soft-error:#EBC598; --text:#FFF6E4; --on-accent:#3d2a0c;
  --font-ui:"Rubik",system-ui,sans-serif; --radius:8px; --cap:round; --join:round; --bevel: 0 0 0 transparent; }
:root[data-theme="anime"]{ --bg:#171631; --panel:#302F53; --border:#8E7BCB; --accent:#F49AD1; --accent-dark:#A7458D; --reward:#FFD98D; --soft-error:#E8B6CD; --text:#FFF5FF; --on-accent:#3a1030;
  --font-ui:"Nunito",system-ui,sans-serif; --radius:20px; --cap:round; --join:round; --bevel: inset 0 5px 0 rgba(255,255,255,.12); }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font-ui);font-weight:800;cursor:pointer;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--reward);outline-offset:3px}
svg{display:block;flex:none}
svg.i path{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:var(--cap);stroke-linejoin:var(--join)}
svg.i.fill path{fill:currentColor}

/* Buttons (theme studio style: panel, border, radius, accent-dark drop) */
.b{background:var(--panel);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--bevel),0 calc(5*var(--u)) 0 var(--accent-dark);display:grid;place-items:center;transition:transform .06s}
.b:active{transform:translateY(calc(4*var(--u)));box-shadow:var(--bevel),0 1px 0 var(--accent-dark)}
.b.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-dark)}
.b.reward{background:var(--reward);color:#3a2800;border-color:var(--accent-dark)}
.b.on{outline:calc(4*var(--u)) solid var(--text);outline-offset:calc(3*var(--u))}
.ico{width:calc(64*var(--u));height:calc(64*var(--u))}
.ico svg{width:calc(32*var(--u));height:calc(32*var(--u))}

/* Screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(26*var(--u));
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb, var(--bg) 70%, transparent);overflow-y:auto}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:calc(12*var(--u));align-items:center}
.corner.l{left:max(14px,env(safe-area-inset-left,0px))} .corner.r{right:max(14px,env(safe-area-inset-right,0px))}
.who{display:flex;align-items:center;gap:calc(12*var(--u));padding:calc(6*var(--u)) calc(18*var(--u)) calc(6*var(--u)) calc(6*var(--u));height:calc(64*var(--u))}
.who .nm{font-size:calc(24*var(--u));max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:calc(var(--radius) * .6);image-rendering:pixelated}

h1.title{margin:0;font-size:calc(54*var(--u));font-weight:900;letter-spacing:.01em;color:var(--reward);text-shadow:0 calc(4*var(--u)) 0 var(--accent-dark)}

/* Level tiles */
.levels{display:flex;gap:calc(16*var(--u));flex-wrap:wrap;justify-content:center}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));padding:calc(14*var(--u)) calc(14*var(--u)) calc(12*var(--u));min-width:calc(150*var(--u))}
.tile .blk{display:block;width:calc(96*var(--u));height:calc(96*var(--u));border-radius:calc(var(--radius) * .6);overflow:hidden;box-shadow:0 calc(6*var(--u)) 0 rgba(0,0,0,.35)}
.tile .blk svg{width:100%;height:100%}
.tile.locked .blk svg.block{filter:grayscale(1) brightness(.45)}
.tile .lock{position:absolute;left:0;right:0;top:calc(14*var(--u));height:calc(96*var(--u));display:grid;place-items:center;color:var(--text)}
.tile .lock svg{width:calc(42*var(--u));height:calc(42*var(--u))}
.tile .stars{display:flex;gap:calc(3*var(--u));height:calc(20*var(--u));color:var(--reward)}
.tile .stars svg{width:calc(20*var(--u));height:calc(20*var(--u))}
svg.off{color:var(--border)}
.pips{display:flex;gap:calc(6*var(--u))}
.pips i{width:calc(26*var(--u));height:calc(12*var(--u));background:var(--bg);border:2px solid var(--border);border-radius:calc(var(--radius) * .3)}
.pips i.on{background:var(--accent);border-color:var(--accent-dark)}
.tile[aria-pressed="true"]{outline:calc(4*var(--u)) solid var(--text);outline-offset:calc(3*var(--u));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(-5*var(--u)))}}

.songs{display:flex;gap:calc(14*var(--u));flex-wrap:wrap;justify-content:center}
.song{height:calc(68*var(--u));padding:0 calc(22*var(--u));font-size:calc(30*var(--u));font-weight:900;color:var(--reward)}
.song[aria-pressed="true"]{background:var(--border);outline:calc(4*var(--u)) solid var(--text);outline-offset:calc(3*var(--u))}
.parts{display:flex;gap:calc(14*var(--u))}
.part{min-width:calc(110*var(--u));height:calc(72*var(--u));padding:0 calc(14*var(--u));display:flex;gap:calc(2*var(--u));justify-content:center;align-items:center;color:var(--reward)}
.part svg{width:calc(30*var(--u));height:calc(30*var(--u))}
.part[aria-pressed="true"]{background:var(--border);outline:calc(4*var(--u)) solid var(--text);outline-offset:calc(3*var(--u))}

.playrow{display:flex;gap:calc(18*var(--u));align-items:center}
.play{width:calc(380*var(--u));height:calc(112*var(--u))}
.play svg{width:calc(60*var(--u));height:calc(60*var(--u))}
.listen{width:calc(112*var(--u));height:calc(112*var(--u))}
.listen svg{width:calc(52*var(--u));height:calc(52*var(--u))}
.err{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--soft-error);border-radius:var(--radius);padding:10px 14px;font-weight:700;max-width:600px;color:var(--soft-error)}
.err svg{width:28px;height:28px}

/* Players */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(170*var(--u)),1fr));gap:calc(18*var(--u));width:min(calc(900*var(--u)),100%)}
.ptile{display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--u));padding:calc(16*var(--u)) calc(10*var(--u))}
.ptile .nm{font-size:calc(24*var(--u));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .meta{display:flex;align-items:center;gap:calc(6*var(--u))}
.ptile.add{color:var(--accent);justify-content:center}
.ptile.add svg{width:calc(70*var(--u));height:calc(70*var(--u))}

/* New player wizard */
.steps{display:flex;gap:calc(10*var(--u))}
.steps i{width:calc(40*var(--u));height:calc(10*var(--u));border-radius:calc(var(--radius) * .3);background:var(--border)}
.steps i.on{background:var(--accent)}
.wiz{display:flex;flex-direction:column;align-items:center;gap:calc(24*var(--u));width:100%}
.avpick{display:grid;grid-template-columns:repeat(5,auto);gap:calc(14*var(--u))}
.avpick button{padding:calc(8*var(--u))}
.name-in{font-family:var(--font-ui);font-weight:800;font-size:calc(30*var(--u));padding:calc(12*var(--u)) calc(16*var(--u));width:calc(420*var(--u));max-width:100%;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:var(--radius);text-align:center}
.go{width:calc(150*var(--u));height:calc(96*var(--u))}
.go svg{width:calc(48*var(--u));height:calc(48*var(--u))}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(20*var(--u));width:min(calc(1120*var(--u)),100%)}
@media (orientation: portrait){
  .themes{grid-template-columns:repeat(2,1fr)}
  .levels{flex-wrap:nowrap;gap:calc(10*var(--u))}
  .tile{min-width:0;padding:calc(10*var(--u))}
  .tile .blk{width:calc(min(96px * 1, 15vw));height:calc(min(96px * 1, 15vw))}
  .tile .lock{top:calc(10*var(--u));height:calc(min(96px, 15vw))}
}
.tcard{padding:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.tcard .pv{display:block;width:100%;height:auto;aspect-ratio:16/10}
.tcard .nm{padding:calc(12*var(--u)) calc(14*var(--u));font-size:calc(20*var(--u))}
.tcard[aria-pressed="true"]{outline:calc(5*var(--u)) solid var(--reward);outline-offset:calc(4*var(--u))}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:calc(14*var(--u));pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#hud > *{pointer-events:auto}
#hud .ico{width:calc(58*var(--u));height:calc(58*var(--u))}
.pill{display:flex;align-items:center;gap:calc(8*var(--u));background:var(--panel);border:2px solid var(--border);border-radius:var(--radius);padding:calc(6*var(--u)) calc(14*var(--u));font-size:calc(26*var(--u));font-weight:900;font-variant-numeric:tabular-nums;height:calc(54*var(--u))}
.pill svg{width:calc(26*var(--u));height:calc(26*var(--u))}
.pill .rw{color:var(--reward)}
#prog{flex:1;min-width:60px;height:calc(22*var(--u));background:var(--panel);border:2px solid var(--border);border-radius:calc(var(--radius) * .5);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent)}
#micbars{display:flex;gap:2px;align-items:flex-end;height:calc(22*var(--u))}
#micbars i{width:calc(6*var(--u));height:25%;background:var(--border);border-radius:1px}
#micbars i.on{background:var(--accent)}
#heard{font-size:calc(18*var(--u));min-width:2.6em;opacity:.8}
#combo{color:var(--reward)}

/* Panels */
.panel{background:var(--panel);border:2px solid var(--border);border-radius:var(--radius);box-shadow:var(--bevel),0 calc(8*var(--u)) 0 var(--accent-dark);padding:calc(26*var(--u)) calc(32*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(18*var(--u));max-width:100%}
.stars-big{display:flex;gap:calc(16*var(--u));color:var(--reward)}
.stars-big svg{width:calc(84*var(--u));height:calc(84*var(--u))}
.stars-big span{animation:pop .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bignum{font-size:calc(76*var(--u));font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.xprow{display:flex;align-items:center;gap:calc(14*var(--u))}
.xprow .blk{display:block;width:calc(44*var(--u));height:calc(44*var(--u));border-radius:calc(var(--radius) * .4);overflow:hidden;filter:grayscale(1) brightness(.55)}
.xprow .blk svg{width:100%;height:100%}
.xprow svg.i{width:calc(28*var(--u));height:calc(28*var(--u));color:var(--border)}
.levelup{display:flex;align-items:center;gap:calc(16*var(--u));font-size:calc(58*var(--u));font-weight:900;color:var(--reward)}
.levelup .blk{display:block;width:calc(100*var(--u));height:calc(100*var(--u));border-radius:calc(var(--radius) * .6);overflow:hidden;animation:pop .5s .2s cubic-bezier(.3,1.8,.5,1) both}
.levelup .blk svg{width:100%;height:100%}
.hist{display:flex;align-items:flex-end;gap:calc(12*var(--u));min-height:calc(44*var(--u))}
.hist .hbest{display:flex;align-items:center;gap:calc(6*var(--u));font-size:calc(26*var(--u));font-weight:900;color:var(--reward);font-variant-numeric:tabular-nums}
.hist .hbest svg{width:calc(26*var(--u));height:calc(26*var(--u))}
.hist .hbars{display:flex;align-items:flex-end;gap:calc(4*var(--u));height:calc(44*var(--u))}
.hist .hbars i{width:calc(12*var(--u));background:var(--border);border-radius:calc(var(--radius) * .15)}
.hist .hbars i.top{background:var(--reward)}
.hist .hbars i.now{outline:2px solid var(--text);outline-offset:1px}
.hist .rec{font-size:calc(22*var(--u));font-weight:900;color:var(--reward);align-self:center}
.btnrow{display:flex;gap:calc(16*var(--u));align-items:center}
.wide{width:calc(170*var(--u));height:calc(92*var(--u))}
.wide svg{width:calc(46*var(--u));height:calc(46*var(--u))}

/* Parent settings (text is fine here) */
#settings{justify-content:flex-start}
.sheet{background:var(--panel);border:2px solid var(--border);border-radius:min(var(--radius),16px);width:min(760px,100%);padding:18px 20px;position:relative;font-size:16px}
.sheet h2{font-size:26px;font-weight:900;margin:0 64px 4px 0}
.sheet h3{font-size:14px;font-weight:900;letter-spacing:.1em;color:var(--reward);margin:20px 0 4px}
.sheet .x{position:absolute;top:12px;right:12px;width:52px;height:52px}
.sheet .x svg{width:26px;height:26px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid color-mix(in srgb, var(--border) 50%, transparent)}
.row label{font-weight:800}
.row small{grid-column:1/-1;opacity:.75;font-size:13px;line-height:1.35}
.row output{font-variant-numeric:tabular-nums;color:var(--reward);font-weight:800;min-width:80px;text-align:right}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.row select,.row input[type=text]{background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:min(calc(var(--radius) * .5),10px);padding:8px;font:inherit;font-weight:700}
.row input[type=checkbox]{width:28px;height:28px;accent-color:var(--accent)}
.txtbtn{font-size:14px;padding:8px 14px;border-radius:min(var(--radius),12px)}
.txtbtn.danger{background:#6d2430;border-color:#a04050}
.minipick{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.minipick button{padding:3px;border:3px solid transparent;background:none;border-radius:6px}
.minipick button[aria-pressed="true"]{border-color:var(--reward)}
.minipick.th button{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;color:var(--text);font-size:14px}
.minipick.th svg{width:64px;height:40px;border-radius:4px}

/* Child's own page: name, avatar, theme (icons, big targets) */
#me{justify-content:flex-start;padding-top:calc(96*var(--u) + env(safe-area-inset-top,0px))}
.mehead{display:flex;align-items:center;gap:calc(18*var(--u));flex-wrap:wrap;justify-content:center}
.mehead .av{display:block}
#me .avpick button{padding:calc(6*var(--u))}
.sheet .whoami{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;margin-left:8px;color:var(--text);letter-spacing:0}
.sheet .whoami svg{width:28px;height:28px;border-radius:4px}

/* Quick language / theme switch */
.qlang .code{font-size:calc(21*var(--u));font-weight:900;letter-spacing:.04em}
.qtheme svg.pv{width:calc(40*var(--u));height:calc(25*var(--u));border-radius:calc(4*var(--u))}
#pause .panel{gap:calc(22*var(--u))}
.popp{width:min(calc(960*var(--u)),100%);position:relative;padding-top:calc(30*var(--u))}
.popp .x{position:absolute;top:calc(-26*var(--u));right:calc(-18*var(--u))}
.langs{display:flex;flex-wrap:wrap;gap:calc(12*var(--u));justify-content:center}
.chip{display:flex;gap:calc(10*var(--u));align-items:center;padding:calc(12*var(--u)) calc(18*var(--u));font-size:calc(22*var(--u))}
.chip .code{font-weight:900;opacity:.7}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent-dark)}
.themes.small{width:100%;gap:calc(14*var(--u))}
.themes.small .nm{font-size:calc(16*var(--u));padding:calc(8*var(--u)) calc(10*var(--u))}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" hidden>
  <button class="b ico" id="btnPause" data-ta="pause" data-icon="pause"></button>
  <div id="prog" data-ta="progress"><i></i></div>
  <div class="pill" id="micPill" data-ta="mic"><span data-icon="mic"></span><span id="micbars"><i></i><i></i><i></i><i></i></span><span id="heard">—</span></div>
  <div class="pill"><span class="rw" data-icon="star" data-fill="1"></span><span id="score">0</span><span id="combo"></span></div>
</div>

<div class="screen" id="home" hidden>
  <div class="corner l"><button class="b who" id="btnWho" data-ta="who"></button><button class="b ico" id="btnMe" data-ta="myPage" data-icon="pencil"></button></div>
  <div class="corner r">
    <button class="b ico qlang" data-ta="language"></button>
    <button class="b ico qtheme" data-ta="theme"></button>
    <button class="b ico" id="btnBackupNag" data-ta="backupNag" data-icon="arrow-down" hidden style="opacity:.6"></button>
    <button class="b ico" id="btnFull" data-ta="full" data-icon="fullscreen"></button>
    <button class="b ico" id="btnSettings" data-ta="settings" data-icon="gear"></button>
  </div>
  <div class="songs" id="songs"></div>
  <div class="levels" id="levels"></div>
  <div class="parts" id="parts"></div>
  <div class="hist" id="homeHist"></div>
  <div class="playrow">
    <button class="b listen" id="btnListen" data-ta="listen" data-icon="speaker"></button>
    <button class="b primary play" id="btnPlay" data-ta="play" data-icon="play" data-fill="1"></button>
  </div>
  <div class="err" id="micErr" hidden><span data-icon="mic"></span><span data-t="micErr"></span></div>
</div>

<div class="screen" id="profiles" hidden><div class="grid" id="ptiles"></div></div>

<div class="screen" id="newp" hidden>
  <div class="corner l"><button class="b ico" id="btnNewBack" data-ta="back" data-icon="back"></button></div>
  <div class="corner r"><button class="b ico qlang" data-ta="language"></button></div>
  <div class="steps"><i id="st1" class="on"></i><i id="st2"></i></div>
  <div class="wiz" id="step1">
    <div class="avpick" id="avpick"></div>
    <input class="name-in" id="newName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off">
    <button class="b primary go" id="btnStep2" data-ta="next" data-icon="next"></button>
  </div>
  <div class="wiz" id="step2" hidden>
    <div class="themes" id="themePick"></div>
    <button class="b primary go" id="btnNewOk" data-ta="done" data-icon="check"></button>
  </div>
</div>

<!-- Child's own page: change name, avatar and theme -->
<div class="screen" id="me" hidden>
  <div class="corner l"><button class="b ico" id="btnMeBack" data-ta="home" data-icon="home"></button></div>
  <div class="corner r"><button class="b ico qlang" data-ta="language"></button></div>
  <div class="mehead"><span id="meAv"></span><input class="name-in" id="meName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off"></div>
  <div class="avpick" id="meAvPick"></div>
  <div class="themes" id="meThemes"></div>
  <button class="b primary go" id="btnMeOk" data-ta="done" data-icon="check"></button>
</div>

<div class="screen" id="results" hidden>
  <div class="panel">
    <div class="stars-big" id="resStars"></div>
    <div class="bignum" id="resPct">0%</div>
    <div class="levelup" id="resLevelUp" hidden></div>
    <div class="hist" id="resHist"></div>
    <div class="xprow" id="resXp"></div>
    <div class="btnrow">
      <button class="b ico" id="btnHome" data-ta="home" data-icon="home"></button>
      <button class="b primary wide" id="btnAgain" data-ta="again" data-icon="retry"></button>
      <button class="b reward wide" id="btnNext" data-ta="nextLevel" data-icon="play" data-fill="1" hidden></button>
    </div>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="panel"><div class="btnrow">
    <button class="b ico" id="btnQuit" data-ta="home" data-icon="home"></button>
    <button class="b ico" id="btnRestart" data-ta="restart" data-icon="retry"></button>
    <button class="b primary wide" id="btnResume" data-ta="resume" data-icon="play" data-fill="1"></button>
  </div>
  <div class="btnrow"><button class="b ico qlang" data-ta="language"></button><button class="b ico qtheme" data-ta="theme"></button></div></div>
</div>

<div class="screen" id="settings" hidden>
  <div class="sheet">
    <button class="b x" id="btnSetClose" data-ta="close" data-icon="cross"></button>
    <h2 data-t="sHead"></h2>
    <h3><span data-t="sPlayer"></span><span class="whoami" id="sWho"></span></h3>
    <div class="row"><label data-t="myPage"></label><button class="b txtbtn" id="btnKidPage" data-t="sKidOpen"></button><small data-t="sKidHint"></small></div>
    <div class="row"><label for="sLang" data-t="sLang"></label><select id="sLang"></select></div>
    <div class="row"><label for="sTempo" data-t="sTempo"></label><output id="oTempo"></output>
      <input type="range" id="sTempo" min="50" max="130" step="5"><small data-t="sTempoHelp"></small></div>
    <div class="row"><label for="sTol" data-t="sTol"></label><output id="oTol"></output>
      <input type="range" id="sTol" min="0" max="800" step="10"><small data-t="sTolHelp"></small></div>
    <div class="row"><label for="sLabels" data-t="sLabels"></label><select id="sLabels"></select></div>
    <div class="row"><label for="sHint" data-t="sHint"></label><input type="checkbox" id="sHint"></div>
    <div class="row"><label for="sOct" data-t="sOct"></label><input type="checkbox" id="sOct"><small data-t="sOctHelp"></small></div>
    <div class="row"><label for="sLock" data-t="sLock"></label><input type="checkbox" id="sLock"><small data-t="sLockHelp"></small></div>
    <div class="row"><label data-t="sProgress"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnReset"></button>
      <button class="b txtbtn danger" id="btnDelete"></button></div></div>
    <h3 data-t="sDevice"></h3>
    <div class="row"><label for="sLat" data-t="sLat"></label><output id="oLat"></output>
      <input type="range" id="sLat" min="0" max="300" step="10"><small data-t="sLatHelp"></small></div>
    <div class="row"><label for="sSens" data-t="sSens"></label><output id="oSens"></output>
      <input type="range" id="sSens" min="1" max="10" step="1"><small data-t="sSensHelp"></small></div>
    <div class="row"><label for="sTouch" data-t="sTouch"></label><input type="checkbox" id="sTouch"><small data-t="sTouchHelp"></small></div>
    <div class="row"><label data-t="sBackup"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnBackup" data-t="sBackupSave"></button>
      <button class="b txtbtn" id="btnRestore" data-t="sBackupLoad"></button></div>
      <input type="file" id="restoreFile" hidden>
      <small id="backupInfo"></small>
      <div id="restoreAsk" hidden style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end">
        <span id="restoreText" style="flex:1 1 220px;font-size:14px;line-height:1.35"></span>
        <button class="b txtbtn" id="btnRestoreNo" data-t="cancel"></button>
        <button class="b txtbtn danger" id="btnRestoreYes" data-t="replace"></button></div></div>
    <p style="opacity:.75;font-size:13px;margin:14px 0 0" data-t="sNote"></p>
  </div>
</div>

<!-- Quick language / theme picker (home, pause, new player) -->
<div class="screen" id="pop" hidden>
  <div class="panel popp">
    <button class="b ico x" id="btnPopClose" data-ta="close" data-icon="cross"></button>
    <div class="langs" id="popLangs"></div>
    <div class="themes small" id="popThemes"></div>
  </div>
</div>

let mic = null, noiseFloor = 0.004;

const nsdf = new Float32Array(1024);
function detectPitch(buf, sr){
  const N = 1024, off = buf.length - N, maxLag = Math.min(Math.floor(sr / 110), N - 64);

    for (let j = 0, n = N - tau; j < n; j++){ const a = buf[off + j], b = buf[off + j + tau]; acf += a * b; m += a * a + b * b; }

    else { if (v > cm){ cm = v; ci = tau; } if (v <= 0){ peaks.push(ci); pos = false; } } }

}

const nextUnhit = () => G.notes.find(n => !n.hit && !n.missed);

function onPlayed(midi, atMs, source){

/* ================= Main loop ================= */
let lastTs = performance.now();

function step(ts){
  const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
  if (state !== 'demo') micFrame(ts);
  if ((state === 'playing' || state === 'demo') && !paused && G){
    let nt = G.time + dt;
    if (G.wait){ const n = nextUnhit(); G.waiting = !!(n && nt >= n.t); if (G.waiting) nt = n.t; }
    G.time = nt;
    if (G.time < 0){ const b = Math.floor(G.time / G.beat); if (b !== G.lastTickBeat && -b <= G.meter){ G.lastTickBeat = b; tick(-b === G.meter); } }
    if (G.demo){
      for (const n of G.notes) if (!n.hit && G.time >= n.t){ n.hit = true; tone(n.midi, n.d); fx.keyFlash[n.midi] = { c: PC_COLOR[n.midi % 12], at: performance.now() };
        burst(keys[n.midi].x + keys[n.midi].w / 2, hitY, PC_COLOR[n.midi % 12], 8); updateHud(); }
    } else if (!G.wait){
      for (const n of G.notes) if (!n.hit && !n.missed && G.time > n.t + G.tol + dev().latency / 1000){ n.missed = true; G.combo = 0; updateHud(); }
    }
    if (G.time > G.end && G.notes.every(n => n.hit || n.missed)) finish();
  }
  draw(ts / 1000, dt);
}

    b.innerHTML = themePreview(k) + '<span class="nm"></span>'; b.querySelector('.nm').textContent = th.name;
    b.onclick = () => { p.theme = k; save(); applyTheme(k); bgCache = null; updateQuick(); renderPop(); if (state === 'home') renderHome(); else if (state === 'me') renderMe(); };
    tb.appendChild(b); });
}

/* Parent settings */
const bindRange = (id, out, get, set, fmt) => { const el = $(id); el.value = get(); $(out).textContent = fmt(+el.value); el.oninput = () => { set(+el.value); $(out).textContent = fmt(+el.value); save(); }; };
function openSettings(){
  const p = P(); settingsOpen = true;
  $('#sWho').innerHTML = avatarSVG(p.avatar, 28) + '<span></span>'; $('#sWho').lastChild.textContent = p.name || tx('noName');
  bindRange('#sTempo', '#oTempo', () => p.opts.tempo, v => p.opts.tempo = v, v => v + '%');
  bindRange('#sTol', '#oTol', () => p.opts.tolMs, v => p.opts.tolMs = v, v => v ? '±' + v + ' ' + tx('ms') : tx('sTolLevel'));
  bindRange('#sLat', '#oLat', () => dev().latency, v => dev().latency = v, v => v + ' ' + tx('ms'));
  bindRange('#sSens', '#oSens', () => dev().sens, v => dev().sens = v, v => tx('sSensFmt').replace('{n}', v));
  const sl = $('#sLabels'); sl.textContent = '';
  [['native', (NOTE_NATIVE[LANG] || LETTERS).filter((_, i) => [0,2,4].includes(i)).join(' ')], ['letters', tx('lLetters') + ' · C D E'], ['none', tx('lNone')]].forEach(([v, txt]) => { const o = document.createElement('option'); o.value = v; o.textContent = txt; sl.appendChild(o); });
  const lg = $('#sLang'); lg.textContent = '';
  LANGS.forEach(L => { const o = document.createElement('option'); o.value = L.id; o.textContent = L.name; lg.appendChild(o); });
  lg.value = LANG; lg.onchange = e => setLang(e.target.value);
  $('#sLabels').value = p.opts.labels; $('#sLabels').onchange = e => { p.opts.labels = e.target.value; heardShown = undefined; save(); };
  [['#sHint','hint'],['#sOct','anyOct'],['#sLock','lockLevels']].forEach(([id, k]) => { $(id).checked = !!p.opts[k]; $(id).onchange = e => { p.opts[k] = e.target.checked; save(); }; });
  $('#sTouch').checked = dev().touch; $('#sTouch').onchange = e => { dev().touch = e.target.checked; save(); };
  armButton('#btnReset', tx('sReset'), () => { p.level = 0; p.streak = 0; p.prog = freshProg(); p.best = {}; p.hist = {}; p.top = {}; p.sel.level = 0; save(); });
  armButton('#btnDelete', tx('sDelete'), () => { db.profiles = db.profiles.filter(x => x.id !== p.id); db.current = db.profiles[0] ? db.profiles[0].id : null; save(); $('#settings').hidden = true; goHome(); });
  renderBackupInfo(); $('#restoreAsk').hidden = true;
  $('#settings').hidden = false;
}
/* Backup: export / import JSON, weekly reminder */
const fmtDate = d => { try { return new Date(d).toLocaleDateString(LANG); } catch(e){ return ''; } };
function renderBackupInfo(){
  const el = $('#backupInfo'); if (!el) return;
  el.textContent = (db.backupAt ? tx('bLast').replace('{d}', fmtDate(db.backupAt)) : tx('bNever')) + (persisted ? tx('bKept') : tx('bMayClear'));
}
const backupDue = () => db.profiles.length > 0 && Date.now() - Math.max(+db.backupAt || 0, +db.remindFrom || 0) > BACKUP_EVERY;
function updateBackupNag(){ const b = $('#btnBackupNag'); if (b) b.hidden = !backupDue(); }
function exportBackup(){
  const data = { format: BACKUP_FORMAT, version: 1, exportedAt: new Date().toISOString(), profiles: db.profiles, current: db.current, device: db.device };
  try {
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const name = 'snezhnye-noty-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e){} }, 30000);
    db.backupAt = Date.now(); save(); askPersist().then(renderBackupInfo); renderBackupInfo(); updateBackupNag();
    return true;
  } catch(e){ $('#backupInfo').textContent = tx('bSaveFail') + (e && e.message || e); return false; }
}
// Returns { db } for a valid backup (or a raw db object), otherwise { error }.
function parseBackup(text){
  let d; try { d = JSON.parse(text); } catch(e){ return { error: tx('eJson') }; }
  if (!d || typeof d !== 'object' || Array.isArray(d)) return { error: tx('eNot') };
  if (d.format !== undefined && d.format !== BACKUP_FORMAT) return { error: tx('eOther') };
  if (typeof d.version === 'number' && d.version > 1) return { error: tx('eNewer') };
  if (!Array.isArray(d.profiles) || !d.profiles.length) return { error: tx('eEmpty') };
  if (d.profiles.length > 100) return { error: tx('eMany') };
  const ids = new Set();
  for (const p of d.profiles){
    if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !p.id || p.id.length > 64 || ids.has(p.id)) return { error: tx('ePlayer') };
    if (p.name !== undefined && (typeof p.name !== 'string' || p.name.length > 40)) return { error: tx('eName') };
    if (p.level !== undefined && !(Number.isFinite(+p.level) && +p.level >= 0)) return { error: tx('eLevel') };
    if (p.avatar !== undefined && !(Number.isInteger(+p.avatar) && +p.avatar >= 0 && +p.avatar < AVATARS.length)) return { error: tx('eAvatar') };
    ids.add(p.id);
  }
  return { db: d };
}
let pendingRestore = null;
$('#btnBackup').onclick = exportBackup;
$('#btnRestore').onclick = () => { $('#restoreFile').value = ''; $('#restoreFile').click(); };
$('#restoreFile').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const ask = $('#restoreAsk'), txt = $('#restoreText');
  const fail = m => { pendingRestore = null; txt.textContent = m; $('#btnRestoreYes').hidden = true; ask.hidden = false; };
  if (f.size > 2e6) return fail(tx('eBig'));
  const rd = new FileReader();
  rd.onerror = () => fail(tx('eRead'));
  rd.onload = () => {
    const r = parseBackup(String(rd.result || ''));
    if (r.error) return fail(r.error);
    pendingRestore = r.db;
    const names = r.db.profiles.map(p => p.name || tx('noName')).join(', ');
    txt.textContent = tx('restoreQ').replace('{n}', r.db.profiles.length).replace('{names}', names).replace('{date}', r.db.exportedAt ? tx('restoreDate').replace('{d}', fmtDate(r.db.exportedAt)) : '');
    $('#btnRestoreYes').hidden = false; ask.hidden = false;
  };
  try { rd.readAsText(f); } catch(err){ fail(tx('eRead')); }
};
$('#btnRestoreNo').onclick = () => { pendingRestore = null; $('#restoreAsk').hidden = true; };
$('#btnRestoreYes').onclick = async () => {
  if (!pendingRestore) return;
  const keepDevice = db.device, keepRemind = db.remindFrom;
  db = normalizeDB({ profiles: pendingRestore.profiles, current: pendingRestore.current, device: keepDevice, backupAt: Date.now(), remindFrom: keepRemind || Date.now() });
  pendingRestore = null; $('#restoreAsk').hidden = true;
  await save();
  $('#settings').hidden = true; goHome();
};
$('#btnBackupNag').onclick = () => { openSettings(); const r = $('#btnBackup'); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'center' }); };
function armButton(sel, label, action){

  b.onclick = () => { if (!armed){ armed = true; b.textContent = tx('sConfirm'); tm = setTimeout(() => { armed = false; b.textContent = label; }, 3000); return; }
    clearTimeout(tm); armed = false; action(); b.textContent = tx('sDoneMsg'); setTimeout(() => b.textContent = label, 1500); };
}

loadDB().catch(() => {}).then(goHome);

window.__sn = { detectPitch, onPlayed: m => onPlayed(m, performance.now(), 'touch'), get game(){ return G; }, get state(){ return state; }, get db(){ return db; }, get lang(){ return LANG; }, get storeKind(){ return storeKind; }, loadDB, save };
})();
