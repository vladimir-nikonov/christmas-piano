<!doctype html>
<html lang="ru" data-theme="pixel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121C32">
<meta name="mobile-web-app-capable" content="yes">
<title>Снежные ноты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Nunito:wght@700;800;900&family=Rubik:wght@500;700;800&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" hidden>
  <button class="b ico" id="btnPause" data-ta="pause" data-icon="pause"></button>
  <div id="prog" data-ta="progress"><i></i></div>
  <div class="pill" id="micPill" data-ta="mic"><span data-icon="mic"></span><span id="micbars"><i></i><i></i><i></i><i></i></span><span id="heard">—</span></div>
  <div class="pill"><span class="rw" data-icon="star" data-fill="1"></span><span id="score">0</span><span id="combo"></span></div>
  <button class="b ico qfull" data-ta="full" data-icon="fullscreen"></button>
</div>

<div class="screen" id="home" hidden>
  <div class="corner l"><button class="b who" id="btnWho" data-ta="who"></button><button class="b ico" id="btnMe" data-ta="myPage" data-icon="pencil"></button></div>
  <div class="corner r">
    <button class="b ico qlang" data-ta="language"></button>
    <button class="b ico qtheme" data-ta="theme"></button>
    <button class="b ico" id="btnBackupNag" data-ta="backupNag" data-icon="arrow-down" hidden style="opacity:.6"></button>
    <button class="b ico qinput"></button>
    <button class="b ico qfull" id="btnFull" data-ta="full" data-icon="fullscreen"></button>
    <button class="b ico" id="btnSettings" data-ta="settings" data-icon="gear"></button>
  </div>
  <div class="songs" id="songs"></div>
  <div class="levels" id="levels"></div>
  <div class="parts" id="parts"></div>
  <div class="hist" id="homeHist"></div>
  <div class="playrow">
    <button class="b listen" id="btnListen" data-ta="listen" data-icon="speaker"></button>
    <button class="b primary play" id="btnPlay" data-ta="play" data-icon="play" data-fill="1"></button>
  </div>
  <div class="micstate" id="micErr" role="alert" hidden>
    <span class="micbadge" data-icon="mic"><span class="x" data-icon="cross"></span></span>
    <div class="micbody">
      <div class="micacts">
        <button class="b primary micretry" id="btnMicRetry" data-icon="retry"><span data-t="micRetry"></span></button>
        <button class="b mictouch" id="btnMicTouch" data-icon="play"><span data-t="micTouch"></span></button>
      </div>
      <p class="michint" id="micHint" data-t="micDenied"></p>
    </div>
  </div>
</div>

<div class="screen" id="profiles" hidden><div class="grid" id="ptiles"></div></div>

<div class="screen" id="newp" hidden>
  <div class="corner l"><button class="b ico" id="btnNewBack" data-ta="back" data-icon="back"></button></div>
  <div class="corner r"><button class="b ico qlang" data-ta="language"></button></div>
  <div class="steps"><i id="st1" class="on"></i><i id="st2"></i></div>
  <div class="wiz" id="step1">
    <div class="avpick" id="avpick"></div>
    <input class="name-in" id="newName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off">
    <button class="b primary go" id="btnStep2" data-ta="next" data-icon="next"></button>
  </div>
  <div class="wiz" id="step2" hidden>
    <div class="themes" id="themePick"></div>
    <button class="b primary go" id="btnNewOk" data-ta="done" data-icon="check"></button>
  </div>
</div>

<!-- Child's own page: change name, avatar and theme -->
<div class="screen" id="me" hidden>
  <div class="corner l"><button class="b ico" id="btnMeBack" data-ta="home" data-icon="home"></button></div>
  <div class="corner r"><button class="b ico qlang" data-ta="language"></button></div>
  <div class="mehead"><span id="meAv"></span><input class="name-in" id="meName" type="text" maxlength="14" data-tp="name" data-ta="name" autocomplete="off"></div>
  <div class="avpick" id="meAvPick"></div>
  <div class="themes" id="meThemes"></div>
  <button class="b primary go" id="btnMeOk" data-ta="done" data-icon="check"></button>
</div>

<div class="screen" id="results" hidden>
  <div class="panel">
    <div class="stars-big" id="resStars"></div>
    <div class="bignum" id="resPct">0%</div>
    <div class="levelup" id="resLevelUp" hidden></div>
    <div class="hist" id="resHist"></div>
    <div class="xprow" id="resXp"></div>
    <!-- Fixed slots: secondary icons on the left (Home, Replay, Next), the one primary action always on the right. -->
    <div class="btnrow resbtns">
      <button class="b ico" id="btnHome" data-ta="home" data-icon="home"></button>
      <button class="b ico" id="btnAgain" data-ta="again" data-icon="retry" hidden></button>
      <button class="b ico" id="btnNext" data-ta="nextLevel" data-icon="next" hidden></button>
      <button class="b primary wide" id="btnMain" data-ta="again"></button>
    </div>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="panel"><div class="btnrow">
    <button class="b ico" id="btnQuit" data-ta="home" data-icon="home"></button>
    <button class="b ico" id="btnRestart" data-ta="restart" data-icon="retry"></button>
    <button class="b primary wide" id="btnResume" data-ta="resume" data-icon="play" data-fill="1"></button>
  </div>
  <div class="btnrow"><button class="b ico qinput"></button></div></div>
</div>

<div class="screen" id="settings" hidden>
  <div class="sheet">
    <button class="b x" id="btnSetClose" data-ta="close" data-icon="cross"></button>
    <h2 data-t="sHead"></h2>
    <h3><span data-t="sPlayer"></span><span class="whoami" id="sWho"></span></h3>
    <div class="row"><label data-t="myPage"></label><button class="b txtbtn" id="btnKidPage" data-t="sKidOpen"></button><small data-t="sKidHint"></small></div>
    <div class="row"><label for="sLang" data-t="sLang"></label><select id="sLang"></select></div>
    <div class="row"><label for="sTempo" data-t="sTempo"></label><output id="oTempo"></output>
      <input type="range" id="sTempo" min="50" max="130" step="5"><small data-t="sTempoHelp"></small></div>
    <div class="row"><label for="sTol" data-t="sTol"></label><output id="oTol"></output>
      <input type="range" id="sTol" min="0" max="800" step="10"><small data-t="sTolHelp"></small></div>
    <div class="row"><label for="sLabels" data-t="sLabels"></label><select id="sLabels"></select></div>
    <div class="row"><label for="sHint" data-t="sHint"></label><input type="checkbox" id="sHint"></div>
    <div class="row"><label for="sOct" data-t="sOct"></label><input type="checkbox" id="sOct"><small data-t="sOctHelp"></small></div>
    <div class="row"><label for="sLock" data-t="sLock"></label><input type="checkbox" id="sLock"><small data-t="sLockHelp"></small></div>
    <div class="row"><label data-t="sProgress"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnReset"></button>
      <button class="b txtbtn danger" id="btnDelete"></button></div></div>
    <h3 data-t="sDevice"></h3>
    <div class="row"><label for="sLat" data-t="sLat"></label><output id="oLat"></output>
      <input type="range" id="sLat" min="0" max="300" step="10"><small data-t="sLatHelp"></small></div>
    <div class="row"><label for="sSens" data-t="sSens"></label><output id="oSens"></output>
      <input type="range" id="sSens" min="1" max="10" step="1"><small data-t="sSensHelp"></small></div>
    <div class="row"><label for="sTouch" data-t="sTouch"></label><input type="checkbox" id="sTouch"><small data-t="sTouchHelp"></small></div>
    <div class="row"><label data-t="sBackup"></label><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="b txtbtn" id="btnBackup" data-t="sBackupSave"></button>
      <button class="b txtbtn" id="btnRestore" data-t="sBackupLoad"></button></div>
      <input type="file" id="restoreFile" hidden>
      <small id="backupInfo"></small>
      <div id="restoreAsk" hidden style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end">
        <span id="restoreText" style="flex:1 1 220px;font-size:14px;line-height:1.35"></span>
        <button class="b txtbtn" id="btnRestoreNo" data-t="cancel"></button>
        <button class="b txtbtn danger" id="btnRestoreYes" data-t="replace"></button></div></div>
    <p style="opacity:.75;font-size:13px;margin:14px 0 0" data-t="sNote"></p>
  </div>
</div>

<!-- Quick language / theme picker (home, new player, child's page) -->
<div class="screen" id="pop" hidden>
  <div class="panel popp">
    <button class="b ico x" id="btnPopClose" data-ta="close" data-icon="cross"></button>
    <div class="langs" id="popLangs"></div>
    <div class="themes small" id="popThemes"></div>
  </div>
</div>

<!-- Splash: theme mascots, shown once per launch for returning players -->
<div id="splash" hidden role="button" tabindex="0" data-ta="tapToStart">
  <div class="sp-fx" aria-hidden="true"></div>
  <div class="sp-cast"></div>
  <h1 class="sp-title" data-t="title"></h1>
  <div class="sp-sub"></div>
  <div class="sp-tap" data-t="tapToStart"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
